<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الغائبات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="team-credits">عمل الطالبات: بسمه العمودي - يارا النهدي - ريم موسى - روان عماد - جود حمد</div>

        <header class="main-header">
            <div>
                <h1>نظام التحضير الذكي 📋</h1>
                <button class="btn-theme" onclick="toggleDarkMode()">🌙 / ☀️ الوضع</button>
            </div>
            <div class="clock-card">
                <span>الوقت:</span>
                <div id="clock" class="clock-display">00:00:00</div>
            </div>
        </header>

        <section class="section-card">
            <h2>اختر الفصل لعرض الغائبات</h2>
            <!-- الصف الأول: من 3-1 إلى 3-4 -->
            <div class="class-buttons" style="margin-bottom: 10px;">
                <button class="btn btn-class" onclick="selectClassForAbsent('3-1')">فصل 3-1</button>
                <button class="btn btn-class" onclick="selectClassForAbsent('3-2')">فصل 3-2</button>
                <button class="btn btn-class" onclick="selectClassForAbsent('3-3')">فصل 3-3</button>
                <button class="btn btn-class" onclick="selectClassForAbsent('3-4')">فصل 3-4</button>
            </div>
            <!-- الصف الثاني: من 3-5 إلى 3-8 -->
            <div class="class-buttons">
                <button class="btn btn-class" onclick="selectClassForAbsent('3-5')">فصل 3-5</button>
                <button class="btn btn-class" onclick="selectClassForAbsent('3-6')">فصل 3-6</button>
                <button class="btn btn-class primary" onclick="selectClassForAbsent('3-7')">فصل 3-7</button>
                <button class="btn btn-class" onclick="selectClassForAbsent('3-8')">فصل 3-8</button>
            </div>
        </section>

        <!-- أزرار فلترة الشهور الهجرية للغائبات -->
        <section class="section-card">
            <h2>فلترة سجل الغياب حسب الشهور الهجرية</h2>
            <div class="month-filter-buttons" id="monthFilterContainer">
                <button class="btn btn-month active" onclick="filterAbsentByMonth('all')">جميع الشهور</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('1')">شهر 1</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('2')">شهر 2</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('3')">شهر 3</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('4')">شهر 4</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('5')">شهر 5</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('6')">شهر 6</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('7')">شهر 7</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('8')">شهر 8</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('9')">شهر 9</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('10')">شهر 10</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('11')">شهر 11</button>
                <button class="btn btn-month" onclick="filterAbsentByMonth('12')">شهر 12</button>
            </div>
        </section>

        <section class="section-card">
            <h1 class="print-title" id="printTitleAbsent">سجل الغياب</h1>
            <h2 id="absentClassTitle">سجل الغائبات - فصل 3-7</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالبة</th>
                        <th>الحالة</th>
                        <th>عدد المرات والتنبيه</th>
                    </tr>
                </thead>
                <tbody id="absentStudentsList"></tbody>
            </table>
        </section>

        <div class="nav-links" style="margin-top: 10px;">
            <button class="btn btn-nav" onclick="goHome()">🏠 الرئيسية</button>
            <button class="btn btn-nav" onclick="goToClassPage()">📄 جدول الحضور</button>
            <button class="btn btn-pdf" onclick="exportToPDF()">📥 تصدير PDF</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
