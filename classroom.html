<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحضير اليومي</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <div class="team-credits">عمل الطالبات: بسمه العمودي - يارا النهدي - ريم موسى - روان عماد - جود حمد</div>

        <header class="main-header">
            <div>
                <h1>نظام التحضير الذكي 📋</h1>
                <button class="btn-theme" onclick="toggleDarkMode()">🌙 / ☀️ الوضع</button>
            </div>
            <div class="clock-card">
                <span>الوقت:</span>
                <div id="clock" class="clock-display">00:00:00</div>
            </div>
        </header>

        <section class="section-card">
            <h2>خيارات التحضير وإدارة الفصل</h2>
            <div class="action-buttons">
                <button class="btn btn-qr" onclick="toggleScanner()">📷 مسح QR Code</button>
                <button class="btn btn-manual" onclick="manualAttendance()">✍️ تحضير يدوي</button>
                <button class="btn btn-transfer" onclick="transferStudentPrompt()">↔️ نقل طالبة لفصل آخر</button>
                <button class="btn btn-class primary" onclick="addNewStudentPrompt()">➕ إضافة طالبة جديدة</button>
            </div>
            <div id="qr-reader" style="width: 100%; max-width: 400px; margin: 15px auto; display: none;"></div>
        </section>

        <section class="section-card">
            <h1 class="print-title" id="printTitleClass">كشف الحضور اليومي</h1>
            <h2 id="classTitle">تحضير الفصل</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالبة</th>
                        <th>الحالة (اضغطي للتغيير)</th>
                        <th>التنبيه والمتابعة</th>
                    </tr>
                </thead>
                <tbody id="studentsList"></tbody>
            </table>
        </section>

        <div class="action-buttons" style="margin-top: 15px;">
            <button class="btn btn-finish" onclick="finishAttendance()">✅ إنهاء التحضير وتصدير التقرير</button>
        </div>

        <div class="section-card" style="margin-top: 20px;">
            <h2>سجلات هذا الفصل</h2>
            <div class="action-buttons">
                <button class="btn btn-daily-log" onclick="goToDailyLogPage()">📄 سجل التحضير اليومي</button>
                <button class="btn btn-late-log" onclick="goToClassLatePage()">📋 سجل تأخير الفصل</button>
                <button class="btn btn-absent-log" onclick="goToAbsentPage()">❌ سجل غياب الفصل</button>
            </div>
        </div>

        <div class="nav-links" style="margin-top: 10px;">
            <button class="btn btn-nav" onclick="goHome()">🏠 الرئيسية</button>
            <button class="btn btn-pdf" onclick="exportToPDF()">📥 تصدير PDF</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
